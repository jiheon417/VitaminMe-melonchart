name: track-melon-chart

on:
  schedule:
    - cron: "*/15 * * * *"    # 15분마다 (GitHub throttle 감안 — 시간당 최소 1회 확보)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:                  # 실행 겹침 방지
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape rank
        env:
          SONG_NO: "602540014"   # fromis_9 - Vitamin ME
        run: python track.py

      - name: Commit & push (with retry)
        run: |
          git config user.name  "chart-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/vitamin_me.json
          if git diff --staged --quiet; then
            echo "변동 없음"; exit 0
          fi
          git commit -m "chart: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 충돌 — 원격 반영 후 재시도 ($i)"
            git pull --rebase origin main
          done
          echo "3회 재시도 실패"; exit 1
