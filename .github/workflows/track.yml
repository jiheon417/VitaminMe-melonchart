name: track-melon-chart

on:
  schedule:
    - cron: "0 * * * *"     # 매시 정각(UTC) = 매시 정각(KST). KST 1시=UTC 16시 자동 포함
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:                  # 실행 겹침 방지
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape rank
        env:
          SONG_NO: "602540014"   # fromis_9 - Vitamin ME
        run: python track.py

      - name: Commit if changed
        run: |
          git config user.name  "chart-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/vitamin_me.json
          if git diff --staged --quiet; then
            echo "변동 없음"
          else
            git commit -m "chart: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
